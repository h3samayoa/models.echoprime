name: EchoPrime Build and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'echoprime/**'
      - 'opentofu/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup OpenTofu 
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
      
      - name: Initialize OpenTofu
        working-directory: ./opentofu
        run: tofu init -backend=true
      
      - name: Validate configuration
        working-directory: ./opentofu
        run: tofu validate
      
      # Get short Git SHA for image tag
      - name: Get short Git SHA
        id: sha
        run: echo "sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
      
      - name: Apply ECR repository
        working-directory: ./opentofu
        run: |
          tofu apply -auto-approve -target=module.ecr.aws_ecr_repository.echoprime_repo
          echo "ECR repository successfully applied"
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Get ECR repository URL
        id: ecr-repo
        working-directory: ./opentofu
        run: |
          REPO_URL=$(tofu output -raw repository_url) 
          echo "url=${REPO_URL}" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./echoprime
          push: true
          tags: ${{ steps.ecr-repo.outputs.url }}:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Apply full infrastructure
        working-directory: ./opentofu
        run: |
          IMAGE_TAG="${{ steps.sha.outputs.sha }}"
          echo "Applying full infrastructure with image tag: ${IMAGE_TAG}"
          tofu plan -var="image_tag=${IMAGE_TAG}" -out=tfplan
          tofu apply -auto-approve tfplan
          echo "Infrastructure successfully updated"
      
      - name: Deployment Summary
        run: |
          echo "EchoPrime deployment summary:"
          echo "- Git Commit: ${{ steps.sha.outputs.sha }}"
          echo "- Image: ${{ steps.ecr-repo.outputs.url }}:${{ steps.sha.outputs.sha }}"
          echo "- Infrastructure successfully updated"
